<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title><link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" media="screen" href="https://fontlibrary.org//face/lato" type="text/css"/>  
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="side_bar">
            <p class="dashboard">
                <img src="icons/view-dashboard.svg">
                Dashboard
            </p>

            <div>
                <p>
                    <img src="icons/home.svg">
                    Home
                </p>
                <p>
                    <img src="icons/account-circle.svg">
                    Profile
                </p>
                <p>
                    <img src="icons/message-reply.svg">
                    Messages
                </p>
                <p>
                    <img src="icons/clock-time-three.svg">
                    History
                </p>
                <p>
                    <img src="icons/note-multiple.svg">
                    Tasks
                </p>
                <p>
                    <img src="icons/account-group.svg">
                    Communities
                </p>
            </div>

            <div>
                <p>
                    <img src="icons/cog.svg">
                    Settings
                </p>
                <p>
                    <img src="icons/help-box.svg">
                    Support
                </p>
                <p>
                    <img src="icons/shield-check.svg">
                    Privacy
                </p>
            </div>
        </div>
        <div class="nav">
            <div class="nav_top">
                <img src="icons/magnify.svg">
                <input type="search">
                <img src="icons/bell-ring-outline.svg">
                <div class="picture"></div>
                <p>Jan Puchowski</p>
            </div>
            <div class="nav_bottom">
                <div class="data">
                    <div class="picture_large"></div>
                    <div class="greeting">
                        <p>Hi there,</p>
                        <p>Jan Puchowski (@puchowsk) </p>
                    </div>
                </div>
                <div class="buttons">
                    <button>New</button>
                    <button>Upload</button>
                    <button>Share</button>
                </div>
            </div>
        </div>
        <div class="main_content">3</div>
    </div>
</body>
</html>
